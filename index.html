<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f6f4ee">
  <title>Simão — Jogo da memória</title>
  <style>
    :root {
      color-scheme: light;
      --ink: #202b2a;
      --muted: #64716d;
      --paper: #f6f4ee;
      --surface: #fffefa;
      --line: #dedfd5;
      --green: #29866c;
      --red: #df6252;
      --yellow: #e6b83f;
      --blue: #438db2;
      --shadow: 0 18px 50px rgba(32, 43, 42, .09);
    }

    * { box-sizing: border-box; }

    body {
      min-width: 320px;
      min-height: 100vh;
      margin: 0;
      color: var(--ink);
      background-color: var(--paper);
      background-image: radial-gradient(#d8d9cf 0.7px, transparent 0.7px);
      background-size: 18px 18px;
      font-family: "Segoe UI", Tahoma, sans-serif;
    }

    button { font: inherit; }

    .page {
      width: min(100% - 40px, 1040px);
      margin-inline: auto;
    }

    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      min-height: 82px;
      border-bottom: 1px solid var(--line);
    }

    .brand {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      color: var(--ink);
      font-size: 15px;
      font-weight: 800;
      text-decoration: none;
    }

    .brand-mark {
      display: grid;
      width: 30px;
      aspect-ratio: 1;
      place-items: center;
      border-radius: 9px;
      color: white;
      background: var(--green);
      font-family: Georgia, serif;
      font-size: 19px;
    }

    .edition {
      color: var(--muted);
      font-size: 12px;
      font-weight: 700;
      letter-spacing: .08em;
      text-transform: uppercase;
    }

    main {
      display: grid;
      grid-template-columns: minmax(0, 1fr) minmax(300px, 430px);
      align-items: center;
      gap: clamp(36px, 8vw, 100px);
      min-height: calc(100vh - 83px);
      padding-block: 54px;
    }

    .intro { max-width: 440px; }

    .eyebrow {
      margin: 0 0 18px;
      color: var(--green);
      font-size: 12px;
      font-weight: 800;
      letter-spacing: .12em;
      text-transform: uppercase;
    }

    h1 {
      margin: 0;
      font-family: Georgia, "Times New Roman", serif;
      font-size: clamp(48px, 7vw, 76px);
      font-weight: 700;
      letter-spacing: 0;
      line-height: .98;
    }

    .lead {
      max-width: 350px;
      margin: 22px 0 30px;
      color: var(--muted);
      font-size: 16px;
      line-height: 1.65;
    }

    .start-button {
      display: inline-flex;
      min-height: 48px;
      align-items: center;
      justify-content: center;
      gap: 10px;
      padding: 0 20px;
      border: 0;
      border-radius: 7px;
      color: white;
      background: var(--ink);
      cursor: pointer;
      font-size: 14px;
      font-weight: 750;
      transition: background-color .18s ease, transform .18s ease;
    }

    .start-button:hover { background: var(--green); transform: translateY(-2px); }
    .start-button:focus-visible, .pad:focus-visible { outline: 3px solid var(--ink); outline-offset: 4px; }

    .arrow { font-size: 18px; line-height: 1; }

    .game-panel {
      padding: 22px;
      border: 1px solid rgba(32, 43, 42, .08);
      border-radius: 12px;
      background: var(--surface);
      box-shadow: var(--shadow);
    }

    .game-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
      margin-bottom: 18px;
    }

    .game-label { margin: 0; font-size: 14px; font-weight: 800; }
    .game-status { margin: 4px 0 0; color: var(--muted); font-size: 12px; }

    .round {
      min-width: 74px;
      padding: 9px 11px;
      border: 1px solid var(--line);
      border-radius: 7px;
      text-align: center;
    }

    .round span { display: block; color: var(--muted); font-size: 10px; font-weight: 700; text-transform: uppercase; }
    .round strong { display: block; margin-top: 2px; font-size: 20px; font-variant-numeric: tabular-nums; }

    .board {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 12px;
      aspect-ratio: 1;
    }

    .pad {
      min-width: 0;
      border: 0;
      border-radius: 8px;
      cursor: pointer;
      opacity: .84;
      transition: filter .12s ease, opacity .12s ease, transform .12s ease;
      -webkit-tap-highlight-color: transparent;
    }

    .pad:hover { opacity: 1; filter: saturate(1.12); }
    .pad:active, .pad.is-lit { opacity: 1; filter: brightness(1.2) saturate(1.1); transform: scale(.97); }
    .pad:disabled { cursor: default; }
    .pad-green { background: var(--green); }
    .pad-red { background: var(--red); }
    .pad-yellow { background: var(--yellow); }
    .pad-blue { background: var(--blue); }

    .game-foot {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-top: 16px;
      color: var(--muted);
      font-size: 11px;
    }

    .record { color: var(--ink); font-weight: 750; }

    @media (max-width: 720px) {
      .page { width: min(100% - 32px, 460px); }
      .topbar { min-height: 68px; }
      .edition { font-size: 10px; }
      main {
        grid-template-columns: 1fr;
        gap: 34px;
        min-height: auto;
        padding-block: 46px 32px;
      }
      .intro { max-width: 100%; }
      h1 { font-size: clamp(52px, 15vw, 68px); }
      .lead { margin-block: 16px 22px; }
      .game-panel { padding: 17px; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { scroll-behavior: auto !important; transition-duration: .01ms !important; }
    }
  </style>
</head>
<body>
  <div class="page">
    <header class="topbar">
      <a class="brand" href="#inicio" aria-label="Simão, início">
        <span class="brand-mark" aria-hidden="true">S</span>
        <span>Jogo do Simão</span>
      </a>
      <span class="edition">Desafio de memória</span>
    </header>

    <main id="inicio">
      <section class="intro" aria-labelledby="page-title">
        <p class="eyebrow">Observe. Lembre. Repita.</p>
        <h1 id="page-title">Até onde vai sua memória?</h1>
        <p class="lead">Acompanhe a sequência de cores e repita na mesma ordem. Cada rodada acrescenta um novo passo.</p>
        <button class="start-button" id="start-button" type="button">
          <span id="start-label">Começar partida</span>
          <span class="arrow" aria-hidden="true">&#8594;</span>
        </button>
      </section>

      <section class="game-panel" aria-label="Área do jogo">
        <div class="game-head">
          <div>
            <p class="game-label">Sua sequência</p>
            <p class="game-status" id="game-status" aria-live="polite">Pronto para jogar</p>
          </div>
          <div class="round" aria-label="Rodada atual">
            <span>Rodada</span>
            <strong id="round-count">00</strong>
          </div>
        </div>

        <div class="board" id="board" role="group" aria-label="Botões coloridos do jogo">
          <button class="pad pad-green" type="button" data-pad="0" aria-label="Verde" disabled></button>
          <button class="pad pad-red" type="button" data-pad="1" aria-label="Vermelho" disabled></button>
          <button class="pad pad-yellow" type="button" data-pad="2" aria-label="Amarelo" disabled></button>
          <button class="pad pad-blue" type="button" data-pad="3" aria-label="Azul" disabled></button>
        </div>

        <div class="game-foot">
          <span id="round-message">Aperte começar para jogar</span>
          <span class="record">Recorde: <span id="best-score">00</span></span>
        </div>
      </section>
    </main>
  </div>

  <script>
    const pads = [...document.querySelectorAll(".pad")];
    const startButton = document.querySelector("#start-button");
    const startLabel = document.querySelector("#start-label");
    const gameStatus = document.querySelector("#game-status");
    const roundCount = document.querySelector("#round-count");
    const roundMessage = document.querySelector("#round-message");
    const bestScore = document.querySelector("#best-score");
    const sequence = [];
    let playerStep = 0;
    let playing = false;
    let best = Number(localStorage.getItem("simao-best") || 0);

    bestScore.textContent = String(best).padStart(2, "0");

    function wait(milliseconds) {
      return new Promise(resolve => setTimeout(resolve, milliseconds));
    }

    async function flashPad(index) {
      pads[index].classList.add("is-lit");
      await wait(380);
      pads[index].classList.remove("is-lit");
      await wait(150);
    }

    async function showSequence() {
      playing = false;
      pads.forEach(pad => { pad.disabled = true; });
      gameStatus.textContent = "Observe a sequência";
      roundMessage.textContent = "Sua vez logo depois";
      await wait(500);
      for (const index of sequence) await flashPad(index);
      playerStep = 0;
      playing = true;
      pads.forEach(pad => { pad.disabled = false; });
      gameStatus.textContent = "Sua vez";
      roundMessage.textContent = "Repita as cores na ordem";
    }

    async function nextRound() {
      sequence.push(Math.floor(Math.random() * pads.length));
      roundCount.textContent = String(sequence.length).padStart(2, "0");
      await showSequence();
    }

    function endGame() {
      playing = false;
      pads.forEach(pad => { pad.disabled = true; });
      gameStatus.textContent = "Fim de jogo";
      roundMessage.textContent = `Você chegou à rodada ${sequence.length}`;
      startLabel.textContent = "Jogar novamente";
      if (sequence.length - 1 > best) {
        best = sequence.length - 1;
        localStorage.setItem("simao-best", String(best));
        bestScore.textContent = String(best).padStart(2, "0");
      }
    }

    startButton.addEventListener("click", () => {
      sequence.length = 0;
      startLabel.textContent = "Reiniciar partida";
      nextRound();
    });

    pads.forEach((pad, index) => {
      pad.addEventListener("click", async () => {
        if (!playing) return;
        playing = false;
        await flashPad(index);
        if (sequence[playerStep] !== index) {
          endGame();
          return;
        }
        playerStep++;
        if (playerStep === sequence.length) {
          await wait(450);
          nextRound();
        } else {
          playing = true;
        }
      });
    });
  </script>
</body>
</html>
